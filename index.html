<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>GOOFER GAUNTLET — Brainrot Micro-Games</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#050505;font-family:'Impact','Arial Black',sans-serif;color:#fff;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
  /* minimal DOM overlays */
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;font-size:18px;text-shadow:2px 2px 0 #000}
  #hud .left,#hud .right{display:flex;gap:14px;align-items:center}
  .chip{background:rgba(0,0,0,.55);padding:6px 12px;border-radius:20px;border:2px solid rgba(255,255,255,.25)}
  #mutator{position:fixed;top:54px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:5px 16px;border-radius:14px;font-size:15px;z-index:6;display:none;letter-spacing:.5px}
  #mutator.show{display:block;animation:pop .3s ease}
  @keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
  #chips{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:7;padding:0 8px;flex-wrap:wrap}
  .sc{background:rgba(0,0,0,.6);border:2px solid #555;color:#fff;padding:8px 12px;border-radius:14px;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:transform .1s}
  .sc.active{border-color:#fff;transform:translateY(-3px)}
  .sc:active{transform:scale(.94)}
  #card{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px;padding:16px}
  #card.show{display:flex}
  #cardCanvas{background:#111;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-width:94%;max-height:62vh}
  #cardBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{background:#fff;color:#000;border:none;padding:12px 22px;border-radius:14px;font-family:inherit;font-size:16px;cursor:pointer;letter-spacing:.5px}
  .btn.secondary{background:transparent;color:#fff;border:2px solid #fff}
  .btn:active{transform:scale(.95)}
  #mute{position:fixed;top:10px;right:10px;z-index:8;background:rgba(0,0,0,.6);border:2px solid #555;color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}
  .center-btn{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border:none;padding:16px 36px;border-radius:16px;font-family:inherit;font-size:22px;cursor:pointer;z-index:6;letter-spacing:1px}
  .center-btn:active{transform:translateX(-50%) scale(.95)}
  #loading{position:fixed;inset:0;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:50}
</style>
</head>
<body>
<div id="loading">LOADING GOOF...</div>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="left">
    <span class="chip" id="sScore">0</span>
    <span class="chip" id="sCombo" style="display:none">x1</span>
  </div>
  <div class="right">
    <span class="chip" id="sTime">30</span>
    <span class="chip" id="sLives" style="display:none">❤❤❤</span>
  </div>
</div>
<div id="mutator"></div>
<button id="mute">🔊</button>
<div id="chips"></div>

<div id="card">
  <canvas id="cardCanvas" width="720" height="900"></canvas>
  <div id="cardBtns">
    <button class="btn" id="replayBtn">GOOF AGAIN</button>
    <button class="btn" id="downloadBtn">DOWNLOAD CARD</button>
    <button class="btn secondary" id="coverBtn">COVER</button>
  </div>
</div>

<script>
"use strict";
(function(){
// ============================================================
// GOOFER GAUNTLET — a brainrot micro-game collection
// Single file, no dependencies. All English.
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const maxW = 480, maxH = 900;
  let w = window.innerWidth, h = window.innerHeight;
  // fit to phone-ish portrait
  if(w/h > maxW/maxH){ w = h*maxW/maxH; }
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.width = Math.floor(w*DPR); cv.height = Math.floor(h*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W = w; H = h;
}
window.addEventListener('resize', resize);
resize();

// ---------- input ----------
const input = {x:0,y:0,down:false,justDown:false,justUp:false};
function setXY(e){
  const r = cv.getBoundingClientRect();
  const t = e.touches?e.touches[0]:e;
  input.x = (t.clientX - r.left) * (W/r.width);
  input.y = (t.clientY - r.top) * (H/r.height);
}
cv.addEventListener('pointerdown', e=>{ setXY(e); input.down=true; input.justDown=true; });
cv.addEventListener('pointermove', e=>{ setXY(e); });
cv.addEventListener('pointerup', e=>{ setXY(e); input.down=false; input.justUp=true; });
cv.addEventListener('pointercancel',()=>{input.down=false;input.justUp=true;});

// ---------- audio (procedural web audio) ----------
const Audio = (()=>{
  let actx=null, muted=false, master=null;
  function ensure(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=0.25; master.connect(actx.destination);}catch(e){} } if(actx && actx.state==='suspended') actx.resume(); }
  function tone(freq, dur, type='square', vol=0.3, slide=0){
    if(muted||!actx) return;
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide), t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur, vol=0.3){
    if(muted||!actx) return;
    const t=actx.currentTime, n=actx.createBufferSource();
    const b=actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    n.buffer=b; const g=actx.createGain(); g.gain.value=vol;
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800;
    n.connect(f); f.connect(g); g.connect(master); n.start(t);
  }
  return {
    init:ensure,
    setMuted:m=>{muted=m; if(master) master.gain.value=m?0:0.25;},
    isMuted:()=>muted,
    bonk:()=>{ensure(); tone(220,0.08,'square',0.35,-120); noise(0.05,0.15);},
    hit:()=>{ensure(); tone(660,0.06,'square',0.3,200);},
    coin:()=>{ensure(); tone(880,0.07,'square',0.28); setTimeout(()=>tone(1320,0.1,'square',0.28),60);},
    jump:()=>{ensure(); tone(300,0.12,'sawtooth',0.25,400);},
    fail:()=>{ensure(); tone(300,0.18,'square',0.35,-150); setTimeout(()=>tone(180,0.25,'square',0.35,-80),120); noise(0.2,0.2);},
    win:()=>{ensure(); [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'square',0.3),i*90));},
    combo:(n)=>{ensure(); tone(440+n*40,0.06,'square',0.25);},
    pop:()=>{ensure(); tone(500,0.05,'triangle',0.25,300);},
    tick:()=>{ensure(); tone(1200,0.03,'square',0.15);},
    whoosh:()=>{ensure(); noise(0.2,0.2);},
    boom:()=>{ensure(); tone(80,0.4,'sawtooth',0.4,-40); noise(0.4,0.3);},
    // simple looping chiptune beat
    beatTimer:null, beatStep:0,
    startBeat(bpm=130, bass=110){
      this.stopBeat();
      if(muted) return;
      ensure();
      const step = 60/bpm/2;
      const notes=[0,3,5,7, 0,3,5,3];
      this.beatTimer = setInterval(()=>{
        if(muted) return;
        const s=this.beatStep%16;
        if(s%4===0) tone(bass,0.12,'sawtooth',0.18); // kick
        if(s%8===4) tone(bass*1.5,0.08,'square',0.12); // snare-ish
        if(s%2===0) tone(bass*4,0.03,'square',0.06); // hat
        const n=notes[Math.floor(s/2)%8];
        if(s%2===0) tone(bass*2*Math.pow(1.0595,n),0.1,'square',0.1);
        this.beatStep++;
      }, step*1000);
    },
    stopBeat(){ if(this.beatTimer){clearInterval(this.beatTimer);this.beatTimer=null;} this.beatStep=0; }
  };
})();

// ---------- utilities ----------
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function roundRect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}

// ---------- particles ----------
const particles=[];
function burst(x,y,color,n=14,speed=4){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rand(speed*0.3,speed);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,color,size:rand(2,6),rot:rand(0,Math.PI*2),vr:rand(-0.3,0.3)});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.98; p.rot+=p.vr; p.life-=0.025;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.save(); ctx.globalAlpha=clamp(p.life,0,1); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// screen shake
let shake=0;
function addShake(v){shake=Math.max(shake,v);}

// floating score texts
const floaters=[];
function floater(x,y,text,color='#fff',size=22){
  floaters.push({x,y,text,color,size,life:1,vy:-1.5});
}
function updateFloaters(){
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.y+=f.vy;f.vy*=0.96;f.life-=0.02;if(f.life<=0)floaters.splice(i,1);}
}
function drawFloaters(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of floaters){
    ctx.globalAlpha=clamp(f.life,0,1);
    ctx.font=`900 ${f.size}px Impact, Arial Black`;
    ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

// ============================================================
// SCENES
// ============================================================
const SCENES = [];

// ---------- Scene 1: GOOBER SMASH ----------
SCENES.push({
  id:'goober', name:'GOOBER SMASH', short:'GOOBER',
  colors:{bg1:'#0a1a05',bg2:'#1a2e0a',accent:'#A3E635',accent2:'#16A34A',ink:'#fff'},
  flags:{duration:20, lives:0},
  mutators:['BIG GOOFER MODE','HATER DISGUISE','TRIPLE TROUBLE','NO HATERS (TRUST ME BRO)'],
  state:{},
  reset(){
    this.state={holes:[], goobers:[], spawnT:0, combo:0, comboT:0, haterRate:0.18, maxCombo:0, bonked:0};
    const cols=3, rows=3;
    const cw=W/cols, ch=(H-200)/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      this.state.holes.push({x:c*cw+cw/2, y:r*ch+ch/2+80, r:Math.min(cw,ch)*0.32});
    }
    // apply mutator
    const m = GAME.mutator;
    if(m==='BIG GOOFER MODE') this.state.bigMode=true;
    if(m==='HATER DISGUISE') this.state.disguise=true;
    if(m==='NO HATERS (TRUST ME BRO)') this.state.haterRate=0.35;
  },
  update(dt){
    const s=this.state;
    s.spawnT-=dt;
    if(s.spawnT<=0 && s.goobers.length<6){
      s.spawnT=rand(0.4,0.9);
      const h=pick(s.holes);
      if(!s.goobers.find(g=>g.hole===h)){
        const isHater = Math.random()<s.haterRate;
        s.goobers.push({hole:h,x:h.x,y:h.y+h.r,ty:h.y-h.r*0.3,life:rand(1.2,2.2),max:2.2,hater:isHater,disguise:s.disguise&&isHater,big:s.bigMode&&Math.random()<0.3,hit:false});
      }
    }
    for(let i=s.goobers.length-1;i>=0;i--){
      const g=s.goobers[i];
      g.life-=dt;
      const t=1-g.life/g.max;
      g.y=lerp(g.hole.y+g.hole.r, g.ty, clamp(t*3,0,1));
      if(g.life<=0) s.goobers.splice(i,1);
    }
    if(s.comboT>0){s.comboT-=dt; if(s.comboT<=0)s.combo=0;}
  },
  draw(){
    const s=this.state;
    // holes
    for(const h of s.holes){
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(h.x,h.y+h.r*0.3,h.r*1.1,h.r*0.4,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.beginPath(); ctx.ellipse(h.x,h.y+h.r*0.35,h.r*0.9,h.r*0.3,0,0,Math.PI*2); ctx.fill();
    }
    for(const g of s.goobers){
      this.drawGoober(g);
    }
  },
  drawGoober(g){
    const r = g.big? g.hole.r*1.1 : g.hole.r*0.8;
    ctx.save(); ctx.translate(g.x,g.y);
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0,r*0.9,r*0.8,r*0.25,0,0,Math.PI*2); ctx.fill();
    // body
    const isHaterLook = g.hater && !g.disguise;
    const bodyColor = isHaterLook? '#666' : (g.big?'#FFD700':'#A3E635');
    ctx.fillStyle=bodyColor;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.stroke();
    // eyes
    const eyeY=-r*0.1, eyeS=r*0.22;
    if(isHaterLook){
      // angry brows
      ctx.strokeStyle='#000'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(-r*0.5,-r*0.5); ctx.lineTo(-r*0.1,-r*0.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r*0.5,-r*0.5); ctx.lineTo(r*0.1,-r*0.25); ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(-r*0.25,eyeY,eyeS,0,Math.PI*2); ctx.arc(r*0.25,eyeY,eyeS,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#f00';
      ctx.beginPath(); ctx.arc(-r*0.25,eyeY,eyeS*0.5,0,Math.PI*2); ctx.arc(r*0.25,eyeY,eyeS*0.5,0,Math.PI*2); ctx.fill();
    } else {
      // goofy eyes
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(-r*0.28,eyeY,eyeS,0,Math.PI*2); ctx.arc(r*0.28,eyeY,eyeS,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.arc(-r*0.24,eyeY,eyeS*0.5,0,Math.PI*2); ctx.arc(r*0.32,eyeY,eyeS*0.5,0,Math.PI*2); ctx.fill();
      // smile
      ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.beginPath();
      ctx.arc(0,r*0.15,r*0.3,0.1,Math.PI-0.1); ctx.stroke();
    }
    // disguise tell
    if(g.disguise){
      ctx.fillStyle='#f00'; ctx.font='12px Impact'; ctx.textAlign='center';
      ctx.fillText('?', r*0.6, -r*0.6);
    }
    ctx.restore();
  },
  onTap(x,y){
    const s=this.state;
    for(let i=s.goobers.length-1;i>=0;i--){
      const g=s.goobers[i];
      const r=g.big?g.hole.r*1.1:g.hole.r*0.9;
      if(Math.hypot(x-g.x,y-g.y)<r){
        if(g.hater){
          Audio.fail(); addShake(18);
          burst(g.x,g.y,'#ff3355',30,7);
          floater(g.x,g.y-30,'YOU BONKED A HATER','#ff5577',18);
          GAME.lose('BONKED A HATER');
          return;
        }
        s.combo++; s.comboT=1.2; s.maxCombo=Math.max(s.maxCombo,s.combo); s.bonked++;
        const pts = (g.big?50:10)*(1+Math.floor(s.combo/5)*0.5);
        GAME.score+=Math.round(pts);
        Audio.combo(s.combo); burst(g.x,g.y,g.big?'#FFD700':'#A3E635',g.big?25:14);
        floater(g.x,g.y-20,'+'+Math.round(pts),g.big?'#FFD700':'#A3E635',20);
        s.goobers.splice(i,1);
        return;
      }
    }
  },
  result(){
    const s=this.state;
    if(GAME.loseReason) return {title:'BONKED A HATER 💀', sub:'HE BONKED BACK.', stat:`BONKED ${s.bonked} • x${s.maxCombo} COMBO`, rank:'CRINGE', color:'#ff3355'};
    if(s.bonked>=40) return {title:'GIGAGOOF STATUS', sub:'YOU BONKED TOO HARD.', stat:`${s.bonked} BONKS • x${s.maxCombo}`, rank:'GIGAGOOF', color:'#A3E635'};
    if(s.bonked>=25) return {title:'CERTIFIED GOOFER', sub:'BONKS INBOUND.', stat:`${s.bonked} BONKS • x${s.maxCombo}`, rank:'GOOFER', color:'#16A34A'};
    if(s.bonked>=10) return {title:'SLIGHTLY TOASTED', sub:'A FEW GOOD BONKS.', stat:`${s.bonked} BONKS`, rank:'TOASTED', color:'#FFB300'};
    return {title:'LIL GOOF', sub:'BONK MORE.', stat:`${s.bonked} BONKS`, rank:'GOOF', color:'#888'};
  }
});

// ---------- Scene 2: NUGGET RUN ----------
SCENES.push({
  id:'nugget', name:'NUGGET RUN', short:'NUGGET',
  colors:{bg1:'#1a0030',bg2:'#2d0a4e',accent:'#FF2D95',accent2:'#00E5FF',ink:'#fff'},
  flags:{duration:0, lives:3, survival:true},
  mutators:['ICE FLOOR','GRAVITY FLIP','SPEED DEMON','CRUMB RAIN'],
  state:{},
  reset(){
    this.state={
      nugget:{x:W*0.25,y:H*0.6,vy:0,jumps:0,r:26,onGround:true},
      obstacles:[], spawnT:1, speed:260, dist:0, gold:0, groundY:H*0.7,
      gravity:1400, ice:GAME.mutator==='ICE FLOOR', flip:GAME.mutator==='GRAVITY FLIP',
      fast:GAME.mutator==='SPEED DEMON', rain:GAME.mutator==='CRUMB RAIN'
    };
    if(this.state.fast) this.state.speed*=1.5;
  },
  update(dt){
    const s=this.state;
    const g = s.flip? -s.gravity : s.gravity;
    s.nugget.vy += g*dt;
    s.nugget.y += s.nugget.vy*dt;
    if((!s.flip && s.nugget.y>=s.groundY) || (s.flip && s.nugget.y<=H-s.groundY)){
      s.nugget.y = s.flip? H-s.groundY : s.groundY;
      s.nugget.vy=0; s.nugget.jumps=0; s.nugget.onGround=true;
    }
    s.dist += s.speed*dt;
    s.spawnT-=dt;
    if(s.spawnT<=0){
      s.spawnT=rand(s.rain?0.6:1.0, s.rain?1.2:2.0);
      const isGold = Math.random()<0.12;
      s.obstacles.push({x:W+40, y:s.groundY-18, w:24, h:36, gold:isGold, type:'crumb'});
      if(s.rain && Math.random()<0.5){
        s.obstacles.push({x:W+40+rand(40,120), y:s.groundY-18, w:24, h:36, gold:false, type:'crumb'});
      }
    }
    for(let i=s.obstacles.length-1;i>=0;i--){
      const o=s.obstacles[i];
      o.x-=s.speed*dt;
      // collision
      const nx=s.nugget.x, ny=s.nugget.y, nr=s.nugget.r;
      if(o.x<nx+nr && o.x+o.w>nx-nr && o.y<ny+nr && o.y+o.h>ny-nr){
        if(o.gold){
          s.gold++; GAME.score+=50; Audio.coin();
          burst(o.x,o.y,'#FFD700',18); floater(o.x,o.y-20,'+50','#FFD700',20);
          s.obstacles.splice(i,1); continue;
        } else {
          Audio.fail(); addShake(16);
          burst(o.x,o.y,'#ff3355',24,6);

    ctx.strokeStyle='#000'; ctx.lineWidth=3;

    ctx.strokeStyle='#00E5FF'; ctx.lineWidth=2;

  onTap(x,y){

  onKey(k){ if(k===' '||k==='ArrowUp'||k==='w'||k==='W') this.onTap(); },

    if(d>=1000) return {title:'CRUMB UP', sub:'STILL RUNNING.', stat:`${d}m`, rank:'GOOFER', color:'#FF2D95'};
    if(d>=300) return {title:'NUGGET IN MOTION', sub:'DECENT STRIDE.', stat:`${d}m`, rank:'TOASTED', color:'#FFB300'};

// ---------- Scene 3: MELTDOWN ----------
SCENES.push({
  id:'melt', name:'MELTDOWN', short:'MELT',
  colors:{bg1:'#2a0a00',bg2:'#5a1a00',accent:'#FF6B35',accent2:'#FFB300',ink:'#fff'},
  flags:{duration:0, lives:0, survival:true},
  mutators:['DOUBLE SUN','HEAT SPIRIT STAMPEDE','CONE OF DOOM','RAIN BLESSED'],
  state:{},
  reset(){
    this.state={
      frost:100, spirits:[], spawnT:1.2, t:0, taps:0,
      scoops:{x:W/2,y:H*0.55,r:40,melty:0},
      sunX:W*0.8, sunY:H*0.15, sunR:50, sunAng:0,
      clouds:[], doubleSun:GAME.mutator==='DOUBLE SUN',
      stampede:GAME.mutator==='HEAT SPIRIT STAMPEDE',
      rainBlessed:GAME.mutator==='RAIN BLESSED'
    };
    if(this.state.rainBlessed) this.state.frost=130;
  },
  update(dt){
    const s=this.state; s.t+=dt;
    // sun movement
    s.sunAng+=dt*0.5;
    const frostDrain = (s.doubleSun? 8:4) * dt;
    s.frost -= frostDrain;
    if(s.frost<=0){ Audio.fail(); addShake(14); GAME.lose('MELTED INTO A PUDDLE'); return; }
    s.scoops.melty = clamp(1-s.frost/100,0,1);
    // spawn spirits
    s.spawnT-=dt;
    const rate = s.stampede?0.5:1.2;
    if(s.spawnT<=0){
      s.spawnT=rand(rate*0.5,rate);
      const side=Math.random()<0.5?-1:1;
      s.spirits.push({x:side<0?-30:W+30, y:rand(H*0.2,H*0.7), vx:side*rand(60,120), r:18, hp:1});
      if(s.stampede && Math.random()<0.5){
        s.spirits.push({x:side<0?-30:W+30, y:rand(H*0.2,H*0.7), vx:side*rand(60,120), r:18, hp:1});
      }
    }
    // rain cloud
    if(s.rainBlessed && Math.random()<0.002){
      s.clouds.push({x:-40, y:rand(40,H*0.3), vx:80, r:30});
    }
    for(let i=s.clouds.length-1;i>=0;i--){const c=s.clouds[i];c.x+=c.vx*dt; if(c.x>W+60)s.clouds.splice(i,1);}
    for(let i=s.spirits.length-1;i>=0;i--){
      const sp=s.spirits[i]; sp.x+=sp.vx*dt; sp.y+=Math.sin(s.t*3+i)*0.5;
      if(sp.x<-60||sp.x>W+60){s.spirits.splice(i,1);continue;}
      // if spirit reaches scoops
      if(Math.hypot(sp.x-s.scoops.x,sp.y-s.scoops.y)<s.scoops.r+sp.r){
        s.frost-=10; s.spirits.splice(i,1); Audio.fail(); addShake(8);
        burst(sp.x,sp.y,'#FF6B35',12);
      }
    }
    GAME.score=Math.floor(s.t*10)+s.taps*20;
  },
  draw(){
    const s=this.state;
    // sun
    this.drawSun(s.sunX,s.sunY,s.sunR);
    if(s.doubleSun) this.drawSun(W*0.2,H*0.2,s.sunR*0.7);
    // clouds
    for(const c of s.clouds){this.drawCloud(c);}
    // ground
    ctx.fillStyle='#3D2817'; ctx.fillRect(0,H*0.75,W,H*0.25);
    // scoops
    this.drawScoops(s.scoops);
    // spirits
    for(const sp of s.spirits){this.drawSpirit(sp);}
  },
  drawSun(x,y,r){
    ctx.save(); ctx.translate(x,y);
    const g=ctx.createRadialGradient(0,0,r*0.3,0,0,r*1.8);
    g.addColorStop(0,'#FFE066'); g.addColorStop(0.5,'#FF6B35'); g.addColorStop(1,'rgba(255,107,53,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r*1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.stroke();
    // angry face
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-r*0.3,-r*0.1,r*0.15,0,Math.PI*2); ctx.arc(r*0.3,-r*0.1,r*0.15,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,r*0.2,r*0.35,Math.PI+0.2,Math.PI*2-0.2); ctx.stroke();
    ctx.restore();
  },
  drawCloud(c){
    ctx.fillStyle='rgba(180,200,255,0.8)';
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.arc(c.x+c.r*0.8,c.y+5,c.r*0.7,0,Math.PI*2); ctx.arc(c.x-c.r*0.8,c.y+5,c.r*0.7,0,Math.PI*2); ctx.fill();
    // rain
    ctx.strokeStyle='#6cf'; ctx.lineWidth=2;
    for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(c.x-rand(0,c.r),c.y+c.r);ctx.lineTo(c.x-rand(0,c.r),c.y+c.r+15);ctx.stroke();}
  },
  drawScoops(sc){
    const m=sc.melty;
    ctx.save(); ctx.translate(sc.x,sc.y);
    // cone
    ctx.fillStyle='#D4A017'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-sc.r*0.5,sc.r*0.4); ctx.lineTo(sc.r*0.5,sc.r*0.4); ctx.lineTo(0,sc.r*1.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    // melted drips
    ctx.fillStyle='#FFF0E0';
    const drip = m*sc.r*0.8;
    ctx.beginPath(); ctx.arc(0,-sc.r*0.2-drip*0.3,sc.r*(0.9-m*0.2),0,Math.PI*2); ctx.fill(); ctx.stroke();
    // drips
    for(let i=0;i<3;i++){
      const dx=(i-1)*sc.r*0.5;
      ctx.beginPath(); ctx.arc(dx,sc.r*0.2+drip*0.5,sc.r*0.2*(1+m),0,Math.PI*2); ctx.fill(); ctx.stroke();
    }
    // face
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-sc.r*0.25,-sc.r*0.3,4,0,Math.PI*2); ctx.arc(sc.r*0.25,-sc.r*0.3,4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,-sc.r*0.1,8,m<0.5?0.2:Math.PI+0.2,m<0.5?Math.PI-0.2:Math.PI*2-0.2); ctx.stroke();
    ctx.restore();
  },
  drawSpirit(sp){
    ctx.save(); ctx.translate(sp.x,sp.y);
    ctx.fillStyle='#FF4500'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,sp.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // flame tail
    ctx.fillStyle='#FFB300';
    ctx.beginPath(); ctx.moveTo(-sp.r*0.6,sp.r*0.3); ctx.quadraticCurveTo(0,sp.r*1.5,sp.r*0.6,sp.r*0.3); ctx.fill();
    // evil eyes
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-sp.r*0.3,-sp.r*0.1,3,0,Math.PI*2); ctx.arc(sp.r*0.3,-sp.r*0.1,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  },
  onTap(x,y){
    const s=this.state;
    // check clouds first
    for(let i=s.clouds.length-1;i>=0;i--){const c=s.clouds[i]; if(Math.hypot(x-c.x,y-c.y)<c.r*1.5){
      s.frost=Math.min(150,s.frost+35); Audio.win(); burst(c.x,c.y,'#6cf',30); floater(c.x,c.y-20,'RAIN BLESSING','#6cf',18);
      s.clouds.splice(i,1); return;
    }}
    // check scoops (bad!)
    if(Math.hypot(x-s.scoops.x,y-s.scoops.y)<s.scoops.r*1.3){
      s.frost-=15; Audio.fail(); addShake(10);
      floater(s.scoops.x,s.scoops.y-30,'STOP TAPPING SCOOPS','#ff5577',16);
      burst(s.scoops.x,s.scoops.y,'#FF6B35',15);
      return;
    }
    // spirits
    for(let i=s.spirits.length-1;i>=0;i--){const sp=s.spirits[i]; if(Math.hypot(x-sp.x,y-sp.y)<sp.r*1.4){
      s.frost=Math.min(150,s.frost+8); s.taps++; Audio.hit();
      burst(sp.x,sp.y,'#FFB300',12); floater(sp.x,sp.y-15,'+8 FROST','#FFB300',16);
      s.spirits.splice(i,1); return;
    }}
  },
  result(){
    const s=this.state;
    const t=Math.floor(s.t);
    if(GAME.loseReason) return {title:'MELTED INTO A PUDDLE 💀', sub:'THE SUN WON.', stat:`SURVIVED ${t}s`, rank:'CRINGE', color:'#ff3355'};
    if(t>=30) return {title:'UNMELTED', sub:'SUN COULD NOT.', stat:`${t}s OF FROST`, rank:'GIGAGOOF', color:'#6cf'};
    if(t>=15) return {title:'KEEPING COOL', sub:'FROSTY.', stat:`${t}s`, rank:'GOOFER', color:'#FFB300'};
    if(t>=8) return {title:'SLIGHTLY MELTED', sub:'DRIPPY.', stat:`${t}s`, rank:'TOASTED', color:'#FF6B35'};
    return {title:'INSTANT MELT', sub:'TOO HOT.', stat:`${t}s`, rank:'GOOF', color:'#888'};
  }
});

    }
    for(let i=s.items.length-1;i>=0;i--){
      const it=s.items[i]; it.y+=it.vy*dt; it.rot+=dt*1.5;
      if(it.y>H+40){s.items.splice(i,1); if(!it.sell){s.progress=Math.max(0,s.progress-3);}}
    }
    // rocket follows progress
    s.rocketY = lerp(s.rocketY, H-120 - (s.progress/100)*(H-220), 0.08);
    // chart
    if(s.t%0.1<dt) s.chart.push(s.progress);
    if(s.chart.length>60) s.chart.shift();
    // win
    if(s.progress>=100){ Audio.win(); burst(W/2,s.rocketY,'#FFD700',40,8); addShake(10); GAME.win('TO THE MOON'); }
  },
  draw(){
    const s=this.state;
    // grid
    ctx.strokeStyle='rgba(0,200,83,0.1)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    // chart
    if(s.chart.length>1){
      ctx.strokeStyle='#00C853'; ctx.lineWidth=3; ctx.beginPath();
      s.chart.forEach((p,i)=>{const x=W*0.5 + (i-s.chart.length/2)*6; const y=H*0.3 - p*1.5; i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.stroke();
    }
    // moon (gerald)
    this.drawGerald(W*0.5, 80, 36);
    // rocket
    this.drawRocket(W*0.5, s.rocketY);
    // progress bar
    ctx.fillStyle='rgba(0,0,0,0.6)'; roundRect(ctx,W*0.1,H-50,W*0.8,16,8); ctx.fill();
    ctx.fillStyle='#00C853'; roundRect(ctx,W*0.1,H-50,W*0.8*s.progress/100,16,8); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 14px Impact'; ctx.textAlign='center'; ctx.fillText(Math.floor(s.progress)+'%', W/2, H-38);
    // items
    for(const it of s.items){this.drawBread(it);}
  },
  drawGerald(x,y,r){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='#F5DEB3'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // craters
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.arc(-r*0.4,-r*0.2,r*0.2,0,Math.PI*2); ctx.arc(r*0.3,r*0.3,r*0.15,0,Math.PI*2); ctx.fill();
    // face
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-r*0.25,-r*0.1,r*0.12,0,Math.PI*2); ctx.arc(r*0.25,-r*0.1,r*0.12,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#000'; ctx.beginPath(); ctx.arc(0,r*0.2,r*0.3,0.2,Math.PI-0.2); ctx.stroke();
    ctx.restore();
  },
  drawRocket(x,y){
    ctx.save(); ctx.translate(x,y);
    // trail
    ctx.fillStyle='rgba(255,180,0,0.5)';
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(rand(-10,10),30+i*10+rand(0,10),rand(4,10),0,Math.PI*2);ctx.fill();}
    // body (baguette)
    ctx.fillStyle='#D4A017'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(0,0,16,40,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // tip
    ctx.fillStyle='#8B4513'; ctx.beginPath(); ctx.moveTo(-10,-36); ctx.lineTo(0,-52); ctx.lineTo(10,-36); ctx.closePath(); ctx.fill(); ctx.stroke();
    // fins
    ctx.fillStyle='#ff3355';
    ctx.beginPath(); ctx.moveTo(-16,20); ctx.lineTo(-28,36); ctx.lineTo(-10,30); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16,20); ctx.lineTo(28,36); ctx.lineTo(10,30); ctx.closePath(); ctx.fill(); ctx.stroke();
    // face (gilbert)
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(-5,-10,2.5,0,Math.PI*2); ctx.arc(5,-10,2.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#000'; ctx.beginPath(); ctx.arc(0,-4,5,0.2,Math.PI-0.2); ctx.stroke();
    // tie
    ctx.fillStyle='#222'; ctx.fillRect(-2,-2,4,10);
    ctx.restore();
  },
  drawBread(it){
    ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot*0.3);
    ctx.fillStyle=it.sell?'#ff3355':'#00C853'; ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 18px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.sell?'SELL':'$',0,1);
    ctx.restore();
  },
  onTap(x,y){
    const s=this.state;
    for(let i=s.items.length-1;i>=0;i--){
      const it=s.items[i];
      if(Math.hypot(x-it.x,y-it.y)<it.r*1.3){
        if(it.sell){
          Audio.fail(); addShake(12); s.progress=Math.max(0,s.progress-12);
          burst(it.x,it.y,'#ff3355',20); floater(it.x,it.y-15,'SOLD THE DIP!','#ff5577',16);
        } else {
          const gain = s.squeeze? 8 : (s.diamond? 6 : 4);
          s.progress=Math.min(100,s.progress+gain); GAME.score+=20;
          Audio.coin(); burst(it.x,it.y,'#00C853',14); floater(it.x,it.y-15,'+'+gain+'%','#00C853',16);
        }
        s.items.splice(i,1); return;
      }
    }
  },
  result(){
    const s=this.state;
    if(GAME.winReason) return {title:'BAGUETTE TO THE MOON 🚀', sub:'STONKS. DIAMOND HANDS.', stat:`${Math.floor(s.progress)}% • ${GAME.score} PTS`, rank:'GIGAGOOF', color:'#00C853'};
    if(GAME.loseReason) return {title:'SOLD THE DIP 💀', sub:'PAPER HANDS.', stat:`${Math.floor(s.progress)}%`, rank:'CRINGE', color:'#ff3355'};
    if(s.progress>=75) return {title:'ALMOST TO THE MOON', sub:'SO CLOSE.', stat:`${Math.floor(s.progress)}%`, rank:'GOOFER', color:'#00E5FF'};
    if(s.progress>=40) return {title:'HOLDING', sub:'DIAMOND HANDS LOADING.', stat:`${Math.floor(s.progress)}%`, rank:'TOASTED', color:'#FFB300'};
    return {title:'WEAK HANDS', sub:'BUY MORE.', stat:`${Math.floor(s.progress)}%`, rank:'GOOF', color:'#888'};
  }
});

// ============================================================
// VIRAL EVENTS — mid-run chaos (memes as mechanics)
// Every 12-20s something absurd flips the game.
// ============================================================
const VIRAL = { active:null, t:0, nextT:0, flash:0 };
let rizzMul=1, rizzStartScore=0;
const VIRAL_EVENTS = [
  { id:'ohio', label:'OHIO GRAVITY FLIP', dur:4, color:'#FF2D95',
    apply:()=>{ try{ if('flip' in scene().state) scene().state.flip=!scene().state.flip; }catch(e){} },
    revert:()=>{ try{ if('flip' in scene().state) scene().state.flip=!scene().state.flip; }catch(e){} } },
  { id:'rizz', label:'RIZZ OVERLOAD 2x PTS', dur:5, color:'#FFD700',
    apply:()=>{ rizzMul=2; rizzStartScore=GAME.score; },
    revert:()=>{ const gained=GAME.score-rizzStartScore; if(gained>0){ GAME.score+=Math.floor(gained); floater(W/2,H*.4,'RIZZ BONUS +'+Math.floor(gained),'#FFD700',26); } rizzMul=1; } },
  { id:'raid', label:'COMMENT RAID', dur:4, color:'#00E5FF',
    apply:()=>{ for(let i=0;i<12;i++) spawnComment(); }, revert:()=>{} },
  { id:'swap', label:'RULES JUST CHANGED', dur:3, color:'#fff',
    apply:()=>{ const m=pick(scene().mutators); if(m!==GAME.mutator){ GAME.mutator=m; showMutator(); try{ scene().reset(); }catch(e){} } }, revert:()=>{} }
];
function viralReset(){
  VIRAL.active=null; VIRAL.t=0; VIRAL.nextT=rand(12,18); VIRAL.flash=0;
  rizzMul=1; rizzStartScore=0;
  COMMENTS.length=0;
  viewCount=1247+Math.floor(Math.random()*800);
  scoreCapT=0; scoreCaption=pick(SCORE_CAPTIONS);
  commentT=0;
}
function viralUpdate(dt){
  // active event countdown
  if(VIRAL.active){
    VIRAL.t-=dt;
    if(VIRAL.t<=0){ try{ VIRAL.active.revert(); }catch(e){} VIRAL.active=null; }
  } else {
    VIRAL.nextT-=dt;
    if(VIRAL.nextT<=0){
      VIRAL.active=pick(VIRAL_EVENTS);
      VIRAL.t=VIRAL.active.dur;
      VIRAL.flash=1;
      try{ VIRAL.active.apply(); }catch(e){}
      Audio.whoosh(); addShake(14);
      floater(W/2,H*0.5, VIRAL.active.label, VIRAL.active.color, 30);
      viewCount += Math.floor(rand(200,600));
    }
  }
  if(VIRAL.flash>0) VIRAL.flash=Math.max(0,VIRAL.flash-dt*2);
  // spawn comments
  commentT+=dt;
  if(commentT>rand(1.2,2.4)){ commentT=0; spawnComment(); }
  // views tick up
  viewCount += Math.random()<0.3?1:0;
  // cycle score caption
  scoreCapT+=dt;
  if(scoreCapT>4){ scoreCapT=0; scoreCaption=pick(SCORE_CAPTIONS); }
}
function drawViralOverlay(){
  if(VIRAL.flash>0){
    ctx.save(); ctx.globalAlpha=VIRAL.flash*0.4;
    ctx.fillStyle= VIRAL.active? VIRAL.active.color : '#fff';
    ctx.fillRect(0,0,W,H); ctx.restore();
  }
  if(VIRAL.active){
    ctx.save(); ctx.globalAlpha=0.9;
    ctx.font='900 18px Impact'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.lineWidth=4; ctx.strokeStyle='#000';
    const lbl='⚠ '+VIRAL.active.label+' '+Math.ceil(VIRAL.t)+'s';
    ctx.strokeText(lbl,W/2,70); ctx.fillStyle=VIRAL.active.color; ctx.fillText(lbl,W/2,70);
    ctx.restore();
  }
}

// ============================================================
// GAME STATE
// ============================================================
const GAME = {
  state:'cover', // cover, countdown, playing, result
  sceneIdx:0,
  score:0,
  lives:3,
  time:0,
  combo:0,
  mutator:null,
  loseReason:null,
  winReason:null,
  sceneState:null,
  countdown:3,
  best: JSON.parse(localStorage.getItem('gooberBestV1')||'{}'),
  resultData:null
};

function scene(){ return SCENES[GAME.sceneIdx]; }

function startScene(idx){
  GAME.sceneIdx=idx;
  GAME.score=0; GAME.lives=scene().flags.lives||3; GAME.time=scene().flags.duration>0?scene().flags.duration:0;
  GAME.combo=0; GAME.loseReason=null; GAME.winReason=null; GAME.mutator=null;
  viralReset();
  // random mutator (sometimes)
  if(Math.random()<0.7) GAME.mutator = pick(scene().mutators);
  scene().reset();
  Audio.startBeat(130);
  GAME.state='countdown'; GAME.countdown=3;
  showMutator();
  buildChips();
}

function showMutator(){
  const el=document.getElementById('mutator');
  if(GAME.mutator){ el.textContent='⚠ '+GAME.mutator; el.classList.add('show'); }
  else { el.classList.remove('show'); el.textContent=''; }
  setTimeout(()=>el.classList.remove('show'), 2500);
}

GAME.lose = function(reason){ GAME.loseReason=reason; endRound(); };
GAME.win = function(reason){ GAME.winReason=reason; endRound(); };
GAME.loseLife = function(reason){
  GAME.lives--;
  if(GAME.lives<=0){ GAME.lose(reason); }
  else { floater(W/2,H/2,'-1 LIFE','#ff5577',28); addShake(10); Audio.fail(); }
};

function endRound(){
  GAME.state='result';
  Audio.stopBeat();
  GAME.resultData = scene().result();
  GAME.resultData.score = GAME.score;
  GAME.resultData.scene = scene().name;
  GAME.resultData.mutator = GAME.mutator || 'NORMAL MODE';
  // best score
  const key=scene().id;
  if(!GAME.best[key] || GAME.score>GAME.best[key]){
    GAME.best[key]=GAME.score;
    localStorage.setItem('gooberBestV1', JSON.stringify(GAME.best));
    GAME.resultData.newBest=true;
  }
  drawResultCard();
  document.getElementById('card').classList.add('show');
}

function buildChips(){

  bar.innerHTML='';
  SCENES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='sc'+(i===GAME.sceneIdx?' active':'');
    b.textContent=s.short;
    b.style.borderColor=s.colors.accent;
    b.style.color=s.colors.accent;
    b.onclick=()=>{ if(GAME.state==='cover'||GAME.state==='result'){ startScene(i); } };
    bar.appendChild(b);
  });
}
buildChips();

// ============================================================
// HUD
// ============================================================
function updateHUD(){
  document.getElementById('sScore').textContent = (GAME.state==='playing'? scoreCaption+' ' : '') + Math.floor(displayScore());
  document.getElementById('sCombo').style.display = GAME.combo>1?'block':'none';
  document.getElementById('sCombo').textContent='x'+GAME.combo;
  // score caption label
  const sc=scene();
  const tEl=document.getElementById('sTime');
  const lEl=document.getElementById('sLives');
  if(sc.flags.duration>0){ tEl.style.display='block'; tEl.textContent=Math.ceil(GAME.time)+'s'; }
  else if(sc.flags.survival){ tEl.style.display='block'; tEl.textContent=Math.floor(GAME.time)+'s'; }
  else { tEl.style.display='none'; }
  if(sc.flags.lives>0){ lEl.style.display='block'; lEl.textContent='❤'.repeat(Math.max(0,GAME.lives)); }
  else { lEl.style.display='none'; }
}

// ============================================================
// KEYBOARD
// ============================================================
window.addEventListener('keydown',e=>{
  if(GAME.state==='playing'){
    const sc=scene();
    if(sc.onKey) sc.onKey(e.key);
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  }
  if(GAME.state==='cover' && (e.key===' '||e.key==='Enter')){ startScene(GAME.sceneIdx); }
});

// ============================================================
// MAIN LOOP
// ============================================================
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  coverT+=dt;

  ctx.save();
  if(shake>0){ ctx.translate(rand(-shake,shake),rand(-shake,shake)); shake*=0.85; if(shake<0.3)shake=0; }

  if(GAME.state==='cover'){
    drawCover();
  } else {
    const sc=scene();
    // bg
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,sc.colors.bg1); g.addColorStop(1,sc.colors.bg2);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    if(GAME.state==='playing'){
      // timer
      if(sc.flags.duration>0){
        GAME.time-=dt;
        if(GAME.time<=0){ GAME.time=0; endRound(); }
      } else {
        GAME.time+=dt;
      }
      sc.update(dt);
      viralUpdate(dt);
      sc.draw();
      updateParticles(); drawParticles();
      updateFloaters(); drawFloaters();
      drawViralOverlay();
      drawComments();
      // scene combo mirror
      if(sc.state && sc.state.combo!==undefined) GAME.combo=sc.state.combo;
    } else if(GAME.state==='countdown'){
      sc.draw();
      updateParticles(); drawParticles();
      // countdown
      ctx.fillStyle='#fff'; ctx.font='900 120px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=8; ctx.strokeStyle='#000';
      const txt = GAME.countdown>0? GAME.countdown : 'GOOF!';
      ctx.strokeText(txt,W/2,H/2); ctx.fillStyle=sc.colors.accent; ctx.fillText(txt,W/2,H/2);
      GAME._cdT=(GAME._cdT||0)+dt;
      if(GAME._cdT>=1){ GAME._cdT=0; GAME.countdown--; Audio.tick(); if(GAME.countdown<0){GAME.state='playing';GAME.time=sc.flags.duration>0?sc.flags.duration:0;} }
    }
  }
  ctx.restore();

  // handle tap input
  if(input.justDown){
    Audio.init();
    if(GAME.state==='cover'){ startScene(GAME.sceneIdx); }
    else if(GAME.state==='playing'){ scene().onTap(input.x,input.y); }
    input.justDown=false;
  }
  if(input.down && GAME.state==='playing' && scene().onDrag){ scene().onDrag(input.x,input.y); }

  updateHUD();
  requestAnimationFrame(loop);
}

// mute
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',()=>{
  const m=!Audio.isMuted(); Audio.setMuted(m);
  muteBtn.textContent=m?'🔇':'🔊';
  if(!m) Audio.startBeat(130); else Audio.stopBeat();
});

// prevent scroll
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

// start
setTimeout(()=>{
  document.getElementById('loading').style.display='none';
  requestAnimationFrame(loop);
},300);
})();
</script>
</body>
</html>
