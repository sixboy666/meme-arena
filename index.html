<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>GOOFER GAUNTLET — Brainrot Micro-Games</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#050505;font-family:'Impact','Arial Black',sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas#cv{display:block;max-width:100%;max-height:100%;touch-action:none;cursor:pointer}
  #hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 64px 8px 12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;font-size:18px;text-shadow:2px 2px 0 #000}
  #hud .left,#hud .right{display:flex;gap:10px;align-items:center}
  .chip{background:rgba(0,0,0,.55);padding:6px 12px;border-radius:20px;border:2px solid rgba(255,255,255,.25);white-space:nowrap}
  .chip.urgent{color:#fff;background:#d11;animation:urgpulse .5s infinite alternate;border-color:#ff8a9a}
  @keyframes urgpulse{from{transform:scale(1)}to{transform:scale(1.18)}}
  #mutator{position:fixed;top:calc(52px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:5px 16px;border-radius:14px;font-size:15px;z-index:6;display:none;letter-spacing:.5px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #mutator.show{display:block;animation:pop .3s ease}
  @keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
  #chips{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:22;padding:0 6px;flex-wrap:wrap}
  .sc{background:rgba(0,0,0,.65);border:2px solid #555;color:#fff;padding:9px 11px;border-radius:14px;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:transform .1s,background .15s;touch-action:none}
  .sc.home{border-color:#fff;color:#fff;background:rgba(255,255,255,.12)}
  .sc.active{border-color:#fff;background:rgba(255,255,255,.22);transform:translateY(-3px)}
  .sc:hover{background:rgba(255,255,255,.25)}
  .sc:active{transform:scale(.92)}
  #card{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
  #card.show{display:flex}
  #cardCanvas{background:#111;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-width:94%;max-height:58vh}
  #cardBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{background:#fff;color:#000;border:none;padding:12px 22px;border-radius:14px;font-family:inherit;font-size:16px;cursor:pointer;letter-spacing:.5px}
  .btn.secondary{background:transparent;color:#fff;border:2px solid #fff}
  .btn:hover{filter:brightness(.9)}
  .btn:active{transform:scale(.95)}
  #topbtns{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:23;display:flex;gap:8px}
  .tbtn{background:rgba(0,0,0,.6);border:2px solid #555;color:#fff;width:42px;height:42px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
  .tbtn:hover{background:rgba(255,255,255,.2)}
  .tbtn:active{transform:scale(.92)}
  #loading{position:fixed;inset:0;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:50}
  @media (max-width:380px){
    .sc{padding:7px 8px;font-size:11px;border-radius:12px}
    #hud{font-size:15px}
    .chip{padding:5px 9px}
  }
  @media (max-height:560px){
    #cardCanvas{max-height:44vh}
  }
</style>
</head>
<body>
<div id="loading">LOADING GOOF...</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud">
  <div class="left">
    <span class="chip" id="sScore">0</span>
    <span class="chip" id="sCombo" style="display:none">x1</span>
  </div>
  <div class="right">
    <span class="chip" id="sTime">30</span>
    <span class="chip" id="sLives" style="display:none">❤❤❤</span>
  </div>
</div>
<div id="mutator"></div>
<div id="topbtns">
  <button class="tbtn" id="pauseBtn" aria-label="Pause">❚❚</button>
  <button class="tbtn" id="mute" aria-label="Mute">🔊</button>
</div>
<div id="chips"></div>
<div id="card">
  <canvas id="cardCanvas" width="720" height="900"></canvas>
  <div id="cardBtns">
    <button class="btn" id="replayBtn">GOOF AGAIN</button>
    <button class="btn" id="downloadBtn">DOWNLOAD CARD</button>
    <button class="btn secondary" id="coverBtn">COVER</button>
  </div>
</div>
<script>
"use strict";
(function(){
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const maxW = 480, maxH = 900;
  let w = window.innerWidth, h = window.innerHeight;
  if(w/h > maxW/maxH){ w = h*maxW/maxH; }
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.width = Math.floor(w*DPR); cv.height = Math.floor(h*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  W = w; H = h;
}
window.addEventListener('resize', resize);
resize();

const input = {x:0,y:0,down:false,justDown:false,justUp:false,id:null};
function setXY(e){
  const r = cv.getBoundingClientRect();
  input.x = (e.clientX - r.left) * (W/r.width);
  input.y = (e.clientY - r.top) * (H/r.height);
}
cv.addEventListener('pointerdown', e=>{
  if(input.id!==null) return;
  input.id=e.pointerId;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  setXY(e); input.down=true; input.justDown=true;
});
cv.addEventListener('pointermove', e=>{ if(e.pointerId===input.id) setXY(e); });
function endPtr(e){
  if(e.pointerId!==input.id) return;
  setXY(e); input.down=false; input.justUp=true; input.id=null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e=>e.preventDefault());

const Audio = (()=>{
  let actx=null, muted=false, master=null;
  function ensure(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=0.25; master.connect(actx.destination);}catch(e){} } if(actx && actx.state==='suspended') actx.resume(); }
  function tone(freq, dur, type, vol, slide){
    if(muted||!actx) return;
    type=type||'square'; vol=vol||0.3; slide=slide||0;
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide), t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur, vol){
    if(muted||!actx) return;
    vol=vol||0.3;
    const t=actx.currentTime, n=actx.createBufferSource();
    const b=actx.createBuffer(1, actx.sampleRate*dur, actx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    n.buffer=b; const g=actx.createGain(); g.gain.value=vol;
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800;
    n.connect(f); f.connect(g); g.connect(master); n.start(t);
  }
  return {
    init:ensure,
    setMuted:m=>{muted=m; if(master) master.gain.value=m?0:0.25;},
    isMuted:()=>muted,
    bonk:()=>{ensure(); tone(220,0.08,'square',0.35,-120); noise(0.05,0.15);},
    hit:()=>{ensure(); tone(660,0.06,'square',0.3,200);},
    coin:()=>{ensure(); tone(880,0.07,'square',0.28); setTimeout(()=>tone(1320,0.1,'square',0.28),60);},
    jump:()=>{ensure(); tone(300,0.12,'sawtooth',0.25,400);},
    fail:()=>{ensure(); tone(300,0.18,'square',0.35,-150); setTimeout(()=>tone(180,0.25,'square',0.35,-80),120); noise(0.2,0.2);},
    win:()=>{ensure(); [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.12,'square',0.3),i*90));},
    combo:(n)=>{ensure(); tone(440+n*40,0.06,'square',0.25);},
    milestone:()=>{ensure(); [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.09,'square',0.26),i*55));},
    tick:()=>{ensure(); tone(1200,0.03,'square',0.15);},
    whoosh:()=>{ensure(); noise(0.2,0.2);},
    beatTimer:null, beatStep:0,
    startBeat(bpm, bass){
      this.stopBeat();
      if(muted) return;
      ensure();
      bpm=bpm||130; bass=bass||110;
      const step = 60/bpm/2;
      const notes=[0,3,5,7,0,3,5,3];
      this.beatTimer = setInterval(()=>{
        if(muted) return;
        const s=this.beatStep%16;
        if(s%4===0) tone(bass,0.12,'sawtooth',0.18);
        if(s%8===4) tone(bass*1.5,0.08,'square',0.12);
        if(s%2===0) tone(bass*4,0.03,'square',0.06);
        const n=notes[Math.floor(s/2)%8];
        if(s%2===0) tone(bass*2*Math.pow(1.0595,n),0.1,'square',0.1);
        this.beatStep++;
      }, step*1000);
    },
    stopBeat(){ if(this.beatTimer){clearInterval(this.beatTimer);this.beatTimer=null;} this.beatStep=0; }
  };
})();

const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function roundRect(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}

const particles=[];
function burst(x,y,color,n,speed){
  n=n||14; speed=speed||4;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rand(speed*0.3,speed);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,color,size:rand(2,6),rot:rand(0,Math.PI*2),vr:rand(-0.3,0.3)});
  }
}
function updateParticles(dt){
  const k=dt===undefined?1:dt*60;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*k; p.y+=p.vy*k; p.vy+=0.15*k; p.vx*=Math.pow(0.98,k); p.rot+=p.vr*k; p.life-=0.025*k;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.save(); ctx.globalAlpha=clamp(p.life,0,1); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

let shake=0;
function addShake(v){shake=Math.max(shake,v);}

const floaters=[];
function floater(x,y,text,color,size){
  color=color||'#fff'; size=size||22;
  floaters.push({x,y,text,color,size,life:1,vy:-1.5});
}
function updateFloaters(dt){
  const k=dt===undefined?1:dt*60;
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.y+=f.vy*k;f.vy*=Math.pow(0.96,k);f.life-=0.02*k;if(f.life<=0)floaters.splice(i,1);}
}
function drawFloaters(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of floaters){
    ctx.globalAlpha=clamp(f.life,0,1);
    ctx.font='900 '+f.size+'px Impact, Arial Black';
    ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

// ---------- juice FX ----------
const fx = { flash:0, flashRGB:'255,255,255', hitStop:0, callouts:[], ripples:[], introT:0, hintT:0 };
const COMBO_TIERS = [
  null,
  {t:'NICE', c:'#A3E635'},
  {t:'SHEESH', c:'#00E5FF'},
  {t:'GOOF MODE', c:'#FF2D95'},
  {t:'UNHINGED', c:'#FFB300'},
  {t:'GIGAGOOF', c:'#FFD700'},
  {t:'BRAIN OFF. VIBES ON.', c:'#fff'}
];
function flashScreen(rgb,a){ fx.flashRGB=rgb; fx.flash=Math.max(fx.flash,a); }
function hitFx(x,y,color){
  fx.hitStop=Math.max(fx.hitStop,0.05);
  flashScreen('255,255,255',0.18);
  if(x!==undefined) burst(x,y,color,10,3.5);
  if(navigator.vibrate) navigator.vibrate(10);
}
function dmgFx(x,y){
  fx.hitStop=Math.max(fx.hitStop,0.09);
  flashScreen('255,45,80',0.32);
  addShake(15);
  if(x!==undefined) burst(x,y,'#ff3355',22,6);
  if(navigator.vibrate) navigator.vibrate([30,35,30]);
}
function callout(text,color){
  fx.callouts.push({text,color,t:1.15,max:1.15});
  Audio.milestone();
  if(navigator.vibrate) navigator.vibrate(28);
}
function ripple(x,y){ fx.ripples.push({x,y,t:0,max:0.45}); }
function updateFx(dt){
  if(fx.flash>0) fx.flash=Math.max(0,fx.flash-dt*2.2);
  for(let i=fx.callouts.length-1;i>=0;i--){fx.callouts[i].t-=dt; if(fx.callouts[i].t<=0)fx.callouts.splice(i,1);}
  for(let i=fx.ripples.length-1;i>=0;i--){fx.ripples[i].t+=dt; if(fx.ripples[i].t>=fx.ripples[i].max)fx.ripples.splice(i,1);}
  if(fx.introT>0) fx.introT-=dt;
  if(fx.hintT>0) fx.hintT-=dt;
}
function drawFx(){
  // tap ripples
  for(const rp of fx.ripples){
    const k=rp.t/rp.max;
    ctx.save(); ctx.globalAlpha=(1-k)*0.55;
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(rp.x,rp.y,8+k*34,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  // vignette
  const vg=ctx.createRadialGradient(W/2,H*0.45,H*0.4,W/2,H*0.5,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.32)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // combo callouts (big Impact center pop)
  for(const c of fx.callouts){
    const k=1-c.t/c.max;
    const pop = k<0.15 ? k/0.15*1.25 : 1.25 - Math.max(0,k-0.15)*0.25;
    ctx.save();
    ctx.translate(W/2,H*0.32);
    ctx.scale(pop,pop);
    ctx.globalAlpha=clamp(c.t/0.35,0,1);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 52px Impact, Arial Black';
    ctx.lineWidth=9; ctx.strokeStyle='#000';
    ctx.strokeText(c.text,0,0);
    ctx.fillStyle=c.color; ctx.fillText(c.text,0,0);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // screen flash
  if(fx.flash>0){
    ctx.fillStyle='rgba('+fx.flashRGB+','+fx.flash+')';
    ctx.fillRect(0,0,W,H);
  }
  // round intro banner
  if(fx.introT>0 && GAME.state==='playing'){
    const a=fx.introT>0.8?(1.3-fx.introT)/0.5:clamp(fx.introT/0.8,0,1);
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.font='900 40px Impact, Arial Black';
    ctx.lineWidth=7; ctx.strokeStyle='#000';
    ctx.strokeText(scene().name,W/2,H*0.2); ctx.fillText(scene().name,W/2,H*0.2);
    if(GAME.mutator){
      ctx.font='bold 16px Impact'; ctx.fillStyle=scene().colors.accent;
      ctx.strokeText(GAME.mutator,W/2,H*0.2+38); ctx.fillText(GAME.mutator,W/2,H*0.2+38);
    }
    ctx.restore();
  }
  // first-seconds hint
  if(fx.hintT>0 && GAME.state==='playing' && scene().hint){
    const pulse=0.75+Math.sin(performance.now()/180)*0.25;
    ctx.save(); ctx.globalAlpha=clamp(fx.hintT,0,1)*pulse;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 19px Impact, Arial Black';
    ctx.lineWidth=5; ctx.strokeStyle='#000';
    ctx.strokeText(scene().hint,W/2,H*0.8); ctx.fillStyle='#fff'; ctx.fillText(scene().hint,W/2,H*0.8);
    ctx.restore();
  }
}

const SCENES = [];

SCENES.push({
  id:'goober', name:'GOOBER SMASH', short:'GOOBER',
  colors:{bg1:'#0a1a05',bg2:'#1a2e0a',accent:'#A3E635',accent2:'#16A34A',ink:'#fff'},
  flags:{duration:20, lives:0},
  hint:'BONK THE GREEN ONES — NEVER THE GRAY HATER',
  mutators:['BIG GOOFER MODE','HATER DISGUISE','TRIPLE TROUBLE','NO HATERS (TRUST ME BRO)'],
  state:{},
  reset(){
    this.state={holes:[], goobers:[], spawnT:0.4, combo:0, comboT:0, haterRate:0.18, maxCombo:0, bonked:0, bigMode:false, disguise:false, triple:false, elapsed:0};
    const cols=3, rows=3;
    const cw=W/cols, ch=(H-200)/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      this.state.holes.push({x:c*cw+cw/2, y:r*ch+ch/2+80, r:Math.min(cw,ch)*0.32});
    }
    const m = GAME.mutator;
    if(m==='BIG GOOFER MODE') this.state.bigMode=true;
    if(m==='HATER DISGUISE') this.state.disguise=true;
    if(m==='TRIPLE TROUBLE') this.state.triple=true;
    if(m==='NO HATERS (TRUST ME BRO)') this.state.haterRate=0.35;
  },
  update(dt){
    const s=this.state;
    s.elapsed+=dt;
    // haters show up more as the round goes on
    s.haterRate = (GAME.mutator==='NO HATERS (TRUST ME BRO)'?0.35:0.16) + Math.min(0.14,s.elapsed*0.008);
    s.spawnT-=dt;
    const ramp=1-clamp(s.elapsed/22,0,0.4);
    if(s.spawnT<=0 && s.goobers.length<6){
      s.spawnT=rand(0.4,0.9)*ramp;
      const freeHoles=s.holes.filter(h=>!s.goobers.find(g=>g.hole===h));
      if(freeHoles.length){
        const batch = s.triple ? Math.min(3,freeHoles.length) : 1;
        for(let k=0;k<batch;k++){
          const h=pick(freeHoles); freeHoles.splice(freeHoles.indexOf(h),1);
          const isHater = Math.random()<s.haterRate;
          s.goobers.push({hole:h,x:h.x,y:h.y+h.r,ty:h.y-h.r*0.3,life:rand(1.2,2.2),max:2.2,hater:isHater,disguise:s.disguise&&isHater,big:s.bigMode&&Math.random()<0.3,hit:false});
        }
      }
    }
    for(let i=s.goobers.length-1;i>=0;i--){
      const g=s.goobers[i];
      g.life-=dt;
      const t=1-g.life/g.max;
      g.y=lerp(g.hole.y+g.hole.r, g.ty, clamp(t*3,0,1));
      if(g.life<=0) s.goobers.splice(i,1);
    }
    if(s.comboT>0){s.comboT-=dt; if(s.comboT<=0)s.combo=0;}
  },
  draw(){
    const s=this.state;
    for(const h of s.holes){
      ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(h.x,h.y+h.r*0.3,h.r*1.1,h.r*0.4,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.beginPath(); ctx.ellipse(h.x,h.y+h.r*0.35,h.r*0.9,h.r*0.3,0,0,Math.PI*2); ctx.fill();
    }
    for(const g of s.goobers){ this.drawGoober(g); }
  },
  drawGoober(g){
    const r = g.big? g.hole.r*1.1 : g.hole.r*0.8;
    ctx.save(); ctx.translate(g.x,g.y);
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(0,r*0.9,r*0.8,r*0.25,0,0,Math.PI*2); ctx.fill();
    const isHaterLook = g.hater && !g.disguise;

const GAME = {
  state:'cover',
  sceneIdx:0,
  score:0,
  lives:3,
  time:0,
  combo:0,
  comboTier:0,
  mutator:null,
  loseReason:null,
  winReason:null,
  countdown:3,
  best: JSON.parse(localStorage.getItem('gooberBestV1')||'{}'),
  resultData:null
};

function scene(){ return SCENES[GAME.sceneIdx]; }

function startScene(idx){
  Audio.init();
  document.getElementById('pauseBtn').textContent='❚❚';
  document.getElementById('card').classList.remove('show');
  particles.length=0; floaters.length=0; shake=0;
  fx.callouts.length=0; fx.ripples.length=0; fx.flash=0; fx.hitStop=0; fx.introT=0; fx.hintT=0;
  GAME.sceneIdx=idx;
  GAME.score=0; GAME.lives=scene().flags.lives||3; GAME.time=scene().flags.duration>0?scene().flags.duration:0;
  GAME.combo=0; GAME.comboTier=0; GAME.loseReason=null; GAME.winReason=null; GAME.mutator=null; GAME._lastSec=-1;
  if(Math.random()<0.7) GAME.mutator = pick(scene().mutators);
  scene().reset();
  Audio.startBeat(130);
  GAME.state='countdown'; GAME.countdown=3; GAME._cdT=0;
  showMutator();
  buildChips();
}

function goCover(){
  GAME.state='cover';
  Audio.stopBeat();
  particles.length=0; floaters.length=0;
  document.getElementById('card').classList.remove('show');
  buildChips();
}

function togglePause(){
  if(GAME.state==='playing'){
    GAME.state='paused';
    Audio.stopBeat();
    document.getElementById('pauseBtn').textContent='▶';
  } else if(GAME.state==='paused'){
    GAME.state='playing';
    last=performance.now();
    if(!Audio.isMuted()) Audio.startBeat(130);
    document.getElementById('pauseBtn').textContent='❚❚';
  }
}

function showMutator(){
  const el=document.getElementById('mutator');
  if(GAME.mutator){ el.textContent='⚠ '+GAME.mutator; el.classList.add('show'); }
  else { el.classList.remove('show'); el.textContent=''; }
  setTimeout(()=>el.classList.remove('show'), 2500);
}

GAME.lose = function(reason){ GAME.loseReason=reason; endRound(); };
GAME.win = function(reason){ GAME.winReason=reason; endRound(); };
GAME.loseLife = function(reason){
  GAME.lives--;
  if(GAME.lives<=0){ GAME.lose(reason); }
  else { floater(W/2,H/2,'-1 LIFE','#ff5577',28); addShake(10); Audio.fail(); }
};

function endRound(){
  GAME.state='result';
  Audio.stopBeat();
  GAME.resultData = scene().result();
  GAME.resultData.score = GAME.score;
  GAME.resultData.scene = scene().name;
  GAME.resultData.mutator = GAME.mutator || 'NORMAL MODE';
  const key=scene().id;
  if(!GAME.best[key] || GAME.score>GAME.best[key]){
    GAME.best[key]=GAME.score;
    localStorage.setItem('gooberBestV1', JSON.stringify(GAME.best));
    GAME.resultData.newBest=true;
  }
  drawResultCard();
  document.getElementById('card').classList.add('show');
}

let coverT=0;
function drawCover(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0a1a'); g.addColorStop(1,'#1a0a2e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.12; ctx.fillStyle='#fff'; ctx.font='900 28px Impact'; ctx.textAlign='center';
  const words=['GIGAGOOF','BRAIN OFF','VIBES ON','MAXIMUM GOOB','GOOF AGAIN','BONK','STONKS','SUS'];
  for(let i=0;i<8;i++){
    const x=(i*137+coverT*20)%(W+100)-50;
    const y=((i*89)%H);
    ctx.fillText(words[i%words.length],x,y);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#fff'; ctx.font='900 56px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=6; ctx.strokeStyle='#000';
  ctx.strokeText('GOOFER',W/2,H*0.18); ctx.fillText('GOOFER',W/2,H*0.18);
  ctx.fillStyle='#FF2D95'; ctx.strokeText('GAUNTLET',W/2,H*0.28); ctx.fillText('GAUNTLET',W/2,H*0.28);
  ctx.fillStyle='#00E5FF'; ctx.font='bold 16px Impact';
  ctx.fillText('5 BRAINROT MICRO-GAMES',W/2,H*0.36);
  const cy=H*0.52;
  SCENES.forEach((scn,i)=>{
    const x=W*0.2 + i*(W*0.15);
    const bob=Math.sin(coverT*3+i)*6;
    ctx.save(); ctx.translate(x,cy+bob);
    ctx.fillStyle=scn.colors.accent; ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#000'; ctx.font='bold 9px Impact'; ctx.textAlign='center';
    ctx.fillText(scn.short,0,3);
    ctx.restore();
  });
  ctx.fillStyle='#fff'; ctx.font='bold 14px Impact';
  ctx.fillText('3 SECONDS TO GOOF. 10 SECONDS TO LOSE.',W/2,H*0.66);
  ctx.fillStyle='#FFD700'; ctx.font='bold 12px Impact';
  ctx.fillText('WARNING: EXTREMELY CATCHY',W/2,H*0.70);
  const pulse=1+Math.sin(coverT*5)*0.08;
  ctx.save(); ctx.translate(W/2,H*0.82); ctx.scale(pulse,pulse);
  ctx.fillStyle='#fff'; ctx.strokeStyle='#000'; ctx.lineWidth=5; ctx.font='900 28px Impact'; ctx.textAlign='center';
  ctx.strokeText('TAP ANYWHERE TO GOOF',0,0); ctx.fillText('TAP ANYWHERE TO GOOF',0,0);
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='bold 11px Impact';
  let txt='BEST: ';
  SCENES.forEach((s)=>{ txt+=s.short+':'+(GAME.best[s.id]||0)+' '; });
  ctx.fillText(txt,W/2,H*0.92);
}

function drawResultCard(){
  const r=GAME.resultData;
  const cc=document.getElementById('cardCanvas');
  const c=cc.getContext('2d');
  const cw=cc.width, ch=cc.height;
  const g=c.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#0a0a1a'); g.addColorStop(1,'#1a0a2e');
  c.fillStyle=g; c.fillRect(0,0,cw,ch);
  // giant background emoji watermark
  c.save();
  c.globalAlpha=0.08; c.fillStyle='#fff'; c.font='900 380px Impact';
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(r.rank==='CRINGE'?'💀':'🔥', cw/2, ch*0.52);
  c.restore();
  // confetti for the upper ranks / new best
  if(r.rank==='GIGAGOOF'||r.rank==='GOOFER'||r.newBest){
    const confCols=['#A3E635','#FF2D95','#00E5FF','#FFD700','#FF6B35','#F0ABFC','#00C853'];
    for(let i=0;i<70;i++){
      // deterministic pseudo-random so the PNG is stable but looks random
      const x=((i*173+41)%cw), y=((i*269+97)%(ch-140))+70;
      const w=6+(i%3)*4, h=10+(i%4)*5, a=(i*2.4)%6.28;
      c.save(); c.translate(x,y); c.rotate(a);
      c.fillStyle=confCols[i%confCols.length];
      c.fillRect(-w/2,-h/2,w,h);
      c.restore();
    }
  }
  c.fillStyle=r.color; c.fillRect(0,0,cw,12); c.fillRect(0,ch-12,cw,12);
  c.fillStyle='rgba(255,255,255,0.4)'; c.font='bold 22px Impact'; c.textAlign='center';
  c.fillText(r.scene, cw/2, 60);
  c.fillStyle='#FFD700'; c.font='bold 20px Impact';
  c.fillText(r.mutator, cw/2, 95);
  c.fillStyle=r.color; c.font='900 64px Impact'; c.textAlign='center'; c.textBaseline='middle';
  c.lineWidth=8; c.strokeStyle='#000';
  c.strokeText(r.title, cw/2, 200); c.fillText(r.title, cw/2, 200);
  c.fillStyle='#fff'; c.font='bold 26px Impact';
  c.fillText(r.sub, cw/2, 280);
  c.fillStyle='rgba(255,255,255,0.08)'; roundRect(c,60,320,cw-120,100,16); c.fill();
  c.strokeStyle=r.color; c.lineWidth=3; roundRect(c,60,320,cw-120,100,16); c.stroke();
  c.fillStyle='#fff'; c.font='900 36px Impact';
  c.fillText(r.stat, cw/2, 370);
  c.fillStyle='rgba(255,255,255,0.5)'; c.font='bold 18px Impact';
  c.fillText('SCORE: '+r.score, cw/2, 400);
  c.fillStyle=r.color; c.font='900 48px Impact';
  c.fillText('RANK: '+r.rank, cw/2, 470);
  if(r.newBest){
    c.save(); c.translate(cw/2,540); c.rotate(-0.08);
    c.fillStyle='#FFD700'; c.strokeStyle='#000'; c.lineWidth=4; c.font='900 40px Impact';
    c.strokeText('★ NEW BEST ★',0,0); c.fillText('★ NEW BEST ★',0,0);
    c.restore();
  }
  // dynamic share caption
  const caps = r.rank==='CRINGE'
    ? ['SCREENSHOT OR NO RIZZ 💀','TAG SOMEONE WHO\'D DO WORSE','SEND THIS TO THE GROUP CHAT','NAH. RUN IT BACK.']
    : ['TAG SOMEONE WHO\'D CRUMBLE','POST IT. THEY DOUBT YOU.','SEND TO UR BRAINROT GROUPCHAT','THIS IS YOUR PERSONALITY NOW'];
  c.fillStyle=r.rank==='CRINGE'?'#ff7a9a':'#FFD700'; c.font='900 22px Impact';
  c.fillText(pick(caps), cw/2, ch-110);
  c.fillStyle='rgba(255,255,255,0.3)'; c.font='bold 16px Impact';
  c.fillText('GOOFER GAUNTLET • BRAINROT EDITION', cw/2, ch-62);
  c.fillStyle='rgba(255,255,255,0.15)'; c.font='bold 13px Impact';
  c.fillText('sixboy666.github.io/meme-arena', cw/2, ch-36);
}

document.getElementById('downloadBtn').addEventListener('click',()=>{
  const cc=document.getElementById('cardCanvas');
  const a=document.createElement('a');
  a.download='goof-result.png';
  a.href=cc.toDataURL('image/png');
  a.click();
});
document.getElementById('replayBtn').addEventListener('click',()=>{
  startScene(GAME.sceneIdx);
});
document.getElementById('coverBtn').addEventListener('click',()=>{
  goCover();
});

function buildChips(){
  const bar=document.getElementById('chips');
  bar.innerHTML='';
  SCENES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='sc'+(i===GAME.sceneIdx&&GAME.state!=='cover'?' active':'');
    b.textContent=s.short;
    b.style.borderColor=s.colors.accent;
    b.style.color=s.colors.accent;
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    b.addEventListener('click',()=>{
      b.blur();
      Audio.init();
      if(GAME.state==='paused') document.getElementById('pauseBtn').textContent='❚❚';
      startScene(i);
    });
    bar.appendChild(b);
  });
  const h=document.createElement('button');
  h.className='sc home'+(GAME.state==='cover'?' active':'');
  h.textContent='⌂ HOME';
  h.addEventListener('pointerdown',e=>e.stopPropagation());
  h.addEventListener('click',()=>{ h.blur(); goCover(); });
  bar.appendChild(h);
}
buildChips();

function updateHUD(){
  document.getElementById('sScore').textContent=Math.floor(GAME.score);
  const cEl=document.getElementById('sCombo');
  cEl.style.display = GAME.combo>1?'block':'none';
  cEl.textContent='x'+GAME.combo;
  cEl.style.color = GAME.combo>=10?'#FFD700':'#fff';
  const sc=scene();
  const tEl=document.getElementById('sTime');
  const lEl=document.getElementById('sLives');
  if(sc.flags.duration>0){
    tEl.style.display='block'; tEl.textContent=Math.ceil(GAME.time)+'s';
    tEl.classList.toggle('urgent',GAME.state==='playing'&&GAME.time<=5);
  }
  else if(sc.flags.survival){ tEl.style.display='block'; tEl.textContent=Math.floor(GAME.time)+'s'; tEl.classList.remove('urgent'); }
  else { tEl.style.display='none'; tEl.classList.remove('urgent'); }
  if(sc.flags.lives>0){ lEl.style.display='block'; lEl.textContent='❤'.repeat(Math.max(0,GAME.lives)); }
  else { lEl.style.display='none'; }
}

window.addEventListener('keydown',e=>{
  // global hotkeys (work in every state)
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key>='1'&&e.key<='5'){
    const i=parseInt(e.key,10)-1;
    if(i<SCENES.length){ if(GAME.state==='paused') document.getElementById('pauseBtn').textContent='❚❚'; startScene(i); }
    e.preventDefault(); return;
  }
  if(e.key==='Escape'){ goCover(); e.preventDefault(); return; }
  if(e.key==='p'||e.key==='P'){ togglePause(); e.preventDefault(); return; }
  if(e.key==='m'||e.key==='M'){ toggleMute(); e.preventDefault(); return; }
  if(GAME.state==='playing'){
    const sc=scene();
    if(sc.onKey) sc.onKey(e.key);
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].indexOf(e.key)>=0) e.preventDefault();
  } else if(GAME.state==='paused'){
    if(e.key===' '||e.key==='Enter'){ togglePause(); e.preventDefault(); }
  }
  if(GAME.state==='cover' && (e.key===' '||e.key==='Enter')){ startScene(GAME.sceneIdx); }
});

function checkComboTier(){
  const sc=scene();
  if(!sc.state || sc.state.combo===undefined) return;
  const c=sc.state.combo;
  const tier = c>=30?6:c>=20?5:c>=15?4:c>=10?3:c>=8?2:c>=5?1:0;
  if(tier>GAME.comboTier){ GAME.comboTier=tier; callout(COMBO_TIERS[tier].t,COMBO_TIERS[tier].c); }
  if(c===0) GAME.comboTier=0;
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  coverT+=dt;
  // hit-stop: world freezes for a few frames after hits, FX keep playing
  let effDt=dt;
  if(fx.hitStop>0){ fx.hitStop-=dt; effDt=0; }
  updateFx(dt);
  ctx.save();
  if(shake>0){ ctx.translate(rand(-shake,shake),rand(-shake,shake)); shake*=0.85; if(shake<0.3)shake=0; }
  if(GAME.state==='cover'){
    drawCover();
  } else {
    const sc=scene();
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,sc.colors.bg1); g.addColorStop(1,sc.colors.bg2);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(GAME.state==='playing'){
      if(sc.flags.duration>0){
        GAME.time-=effDt;
        if(GAME.time<=0){ GAME.time=0; endRound(); }
        else {
          // urgent ticking in the last 5 seconds
          const sec=Math.ceil(GAME.time);
          if(sec<=5 && sec!==GAME._lastSec){ GAME._lastSec=sec; if(sec>0) Audio.tick(); }
        }
      } else {
        GAME.time+=effDt;
      }
      sc.update(effDt);
      sc.draw();
      updateParticles(effDt); drawParticles();
      updateFloaters(effDt); drawFloaters();
      if(sc.state && sc.state.combo!==undefined){
        GAME.combo=sc.state.combo;
        checkComboTier();
      }
      drawFx();
    } else if(GAME.state==='countdown'){
      sc.draw();
      updateParticles(effDt); drawParticles();
      const pulse = 1 + Math.max(0,1-GAME._cdT%1)*0.15;
      ctx.save(); ctx.translate(W/2,H/2); ctx.scale(pulse,pulse);
      ctx.fillStyle='#fff'; ctx.font='900 120px Impact'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=8; ctx.strokeStyle='#000';
      const txt = GAME.countdown>0? GAME.countdown : 'GOOF!';
      ctx.strokeText(txt,0,0); ctx.fillStyle=sc.colors.accent; ctx.fillText(txt,0,0);
      ctx.restore();
      GAME._cdT=(GAME._cdT||0)+dt;
      if(GAME._cdT>=1){
        GAME._cdT=0; GAME.countdown--; Audio.tick();
        if(GAME.countdown<0){
          GAME.state='playing';
          GAME.time=sc.flags.duration>0?sc.flags.duration:0;
          GAME._lastSec=-1;
          fx.introT=1.5; fx.hintT=4.5;
          addShake(6); flashScreen('255,255,255',0.25);
        }
      }
      drawFx();
    } else if(GAME.state==='paused'){
      sc.draw();
      drawParticles();
      drawFloaters();
      drawFx();
      ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#fff'; ctx.lineWidth=6; ctx.strokeStyle='#000'; ctx.font='900 64px Impact';
      ctx.strokeText('PAUSED',W/2,H/2-30); ctx.fillText('PAUSED',W/2,H/2-30);
      ctx.font='bold 18px Impact';
      ctx.fillText('TAP TO RESUME',W/2,H/2+24);
      ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='bold 13px Impact';
      ctx.fillText('P / ▶ TO RESUME • 1-5 SWITCH GAME • ESC HOME',W/2,H/2+56);
    }
  }
  ctx.restore();
  if(input.justDown){
    Audio.init();
    ripple(input.x,input.y);
    if(GAME.state==='cover'){ startScene(GAME.sceneIdx); }
    else if(GAME.state==='playing'){ fx.hintT=0; scene().onTap(input.x,input.y); }
    else if(GAME.state==='paused'){ togglePause(); }
    input.justDown=false;
  }
  if(input.down && GAME.state==='playing' && scene().onDrag){ scene().onDrag(input.x,input.y); }
  updateHUD();
  requestAnimationFrame(loop);
}

function toggleMute(){
  const m=!Audio.isMuted(); Audio.setMuted(m);
  document.getElementById('mute').textContent=m?'🔇':'🔊';
  if(!m){ if(GAME.state==='playing') Audio.startBeat(130); } else Audio.stopBeat();
}
document.getElementById('pauseBtn').addEventListener('click',()=>{ document.getElementById('pauseBtn').blur(); togglePause(); });
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',()=>{ muteBtn.blur(); toggleMute(); });

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && GAME.state==='playing'){ togglePause(); }
});
window.addEventListener('resize',()=>{
  // keep drag targets inside the new viewport mid-game
  const sc=scene();
  if(sc && sc.state){ const st=sc.state;
    if(st.box){ st.box.x=clamp(st.box.x, st.box.w/2, W-st.box.w/2); st.box.y=H-128; st.box.tx=clamp(st.box.tx||st.box.x, st.box.w/2, W-st.box.w/2); }
  }
});

setTimeout(()=>{
  document.getElementById('loading').style.display='none';
  requestAnimationFrame(loop);
},300);
window.__goof={GAME,SCENES,fx,scene,drawResultCard,startScene,checkComboTier};
})();
</script>
